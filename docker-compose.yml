version: '3.8'

services:
  worker-01:
    # Immagine: locale di default, o quella di Docker Hub su AWS
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    container_name: ${EC2_ID:-locale}_worker_${TRAINING_MODE:-centralized}_01
    ports:
      - "18861:18861"
    environment:
      - RPC_HOST=127.0.0.1
      - RPC_PORT=18861
    volumes:
      - ./data:/app/data
    # Il comando si auto-compone in base a come configuri le variabili
    command: python -m src.worker.run_worker Worker-${EC2_ID:-Locale}-${TRAINING_MODE:-centralized}-01 18861 ${TRAINING_MODE:-centralized} ${ENV_MODE:-local}
    restart: on-failure

  worker-02:
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    container_name: ${EC2_ID:-locale}_worker_${TRAINING_MODE:-centralized}_02
    ports:
      - "18862:18862"
    environment:
      - RPC_HOST=127.0.0.1
      - RPC_PORT=18862
    volumes:
      - ./data:/app/data
    command: python -m src.worker.run_worker Worker-${EC2_ID:-Locale}-${TRAINING_MODE:-centralized}-02 18862 ${TRAINING_MODE:-centralized} ${ENV_MODE:-local}
    restart: on-failure
        
    
       

    