services:
  orchestrator:
    build: .
    mem_limit: 2048m
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    user: "${MY_UID:-1000}:${MY_GID:-1000}"
    stdin_open: true
    tty: true
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - WORKER_HEARTBEAT_TIMEOUT=120
      - PYTHONUNBUFFERED=1
      - NUM_WORKERS=${NUM_WORKERS:-2}
      - ENV_MODE=${ENV_MODE:-local}
      - TRAINING_MODE=${TRAINING_MODE:-federated}
      - EC2_ID=${EC2_ID:-Locale}
      - LOCAL_STORAGE_PATH=/app/.local_storage
      - RUNNING_IN_DOCKER=true
    volumes:
      - .:/app:z
      - ./synthetic:/app/synthetic:z
      - ./.local_storage:/app/.local_storage:z
      - ./saved_models:/app/saved_models:z
      - ./workers_cache:/app/workers_cache:z
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "ORCHESTRATOR_ID=Orchestrator-${EC2_ID:-Locale}-${TRAINING_MODE:-federated}-$$(hostname)
        python -m src.master.orchestrator.main"
    restart: on-failure

  worker:
    #build: .
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    user: "${MY_UID:-1000}:${MY_GID:-1000}"
    ports:
      - "18861-18870:18861"
    cpus: '${WORKER_CPUS:-2.0}'
    mem_limit: 2048m
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - WORKER_HEARTBEAT_TIMEOUT=120
      - NUM_WORKERS=${NUM_WORKERS:-2}
      - PYTHONUNBUFFERED=1
      - RPC_PORT=18861
      - ENV_MODE=${ENV_MODE:-local}
      - TRAINING_MODE=${TRAINING_MODE:-federated}
      - RUNNING_IN_DOCKER=true
      - LOCAL_STORAGE_PATH=/app/.local_storage
      - WORKER_CORES=${WORKER_CORES:-}
    volumes:
      - .:/app:z
      - ./synthetic:/app/synthetic:z
      - ./.local_storage:/app/.local_storage:z
      - ./saved_models:/app/saved_models:z
      - ./workers_cache:/app/workers_cache:z
    command: >
      sh -c "
      if command -v tc >/dev/null 2>&1; then
        if ! tc qdisc add dev eth0 root netem ${NET_SCENARIO:-delay 50ms}; then
          echo '[WARN] impossibile applicare tc netem sul worker (permessi/capability mancanti)' >&2;
        fi;
      fi;
      exec python -m src.worker.main Worker-${EC2_ID:-Locale}-${TRAINING_MODE:-federated}-$$(hostname) 18861 federated local
      "
    depends_on:
      - orchestrator
    restart: on-failure

  test-engine:
    #build: .
    profiles:
      - testing
    mem_limit: 4096m
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    user: "${MY_UID:-1000}:${MY_GID:-1000}"
    environment:
      - TC_INTERFACE=eth0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - ENV_MODE=${ENV_MODE:-local}
      - TRAINING_MODE=${TRAINING_MODE:-federated}
      - RUNNING_IN_DOCKER=true
      - LOCAL_STORAGE_PATH=/app/.local_storage
      - DOCKER_GID=${DOCKER_GID}
      - FED_WORKER_WAIT_TIMEOUT_SECONDS=${FED_WORKER_WAIT_TIMEOUT_SECONDS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app:z
      - ./synthetic:/app/synthetic:z
      - ./.local_storage:/app/.local_storage:z
      - ./saved_models:/app/saved_models:z
      - ./workers_cache:/app/workers_cache:z
    group_add:
      - "${DOCKER_GID}"
    cap_add:
      - NET_ADMIN
    command: python -m src.testing.engine