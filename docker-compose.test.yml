services:
  worker:
    extends:
      file: docker-compose.yml
      service: worker
    # eredita build/volumi/risorse dal compose principale;
    # qui puoi solo override di NUM_WORKERS/NET_SCENARIO per i test

  test-runner:
    build: .
    image: ${IMAGE_NAME:-rf-worker-locale:latest}
    user: "${MY_UID}:${MY_GID}"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - WORKER_HEARTBEAT_TIMEOUT=120
      - ENV_MODE=${ENV_MODE:-local}
      - TRAINING_MODE=${TRAINING_MODE:-centralized}
      - EC2_ID=${EC2_ID:-Locale}
      - LOCAL_STORAGE_PATH=/app/.local_storage
      - RUNNING_IN_DOCKER=true        # serve solo a _wait_for_docker_workers
      - NET_SCENARIO=${NET_SCENARIO:-delay 50ms}
    volumes:
      - .:/app:z
      - ./synthetic:/app/synthetic:z
      - ./.local_storage:/app/.local_storage:z
      - ./saved_models:/app/saved_models:z
      - ./workers_cache:/app/workers_cache:z
      - ./test_reports:/app/test_reports:z
    command: python -m src.testing.engine
    depends_on:
      - worker